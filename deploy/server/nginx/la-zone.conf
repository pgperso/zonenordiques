# /etc/nginx/sites-available/la-zone.conf
#
# Only Cloudflare reaches this server (ufw allows 80/443 from Cloudflare's
# ranges only), and the real visitor IP is restored from CF-Connecting-IP by
# /etc/nginx/conf.d/cloudflare-realip.conf. TLS uses Cloudflare Origin
# Certificates (SSL mode "Full (strict)" in each Cloudflare zone).

# upstream <brand> { ... } — root-owned, rewritten by switch-upstream.sh
# (run via sudo by activate-release.sh) on each deploy.
include /etc/nginx/la-zone-upstreams/*.conf;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# Shared proxy settings, included in each app location.
# The app trusts X-Real-IP for rate limiting (src/lib/clientIp.ts), so every
# client-supplied forwarding header is overwritten or cleared here.
proxy_http_version 1.1;
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Forwarded-Proto  https;
proxy_set_header X-Vercel-Forwarded-For "";
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $connection_upgrade;
proxy_read_timeout 300s;
proxy_buffer_size 32k;
proxy_buffers 16 32k;

client_max_body_size 25m;

# `gzip on` is already set by Ubuntu's nginx.conf; these tune it.
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

# ssl_protocols / ssl_prefer_server_ciphers live in nginx.conf (set by bootstrap.sh).
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Plain HTTP: Cloudflare upgrades visitors to HTTPS itself; anything that
# still arrives on :80 is bounced.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

# Unknown hosts on :443 (e.g. someone hitting the bare IP): refuse the TLS
# handshake. (nginx 1.24 on Ubuntu 24.04: http2 goes on the listen line.)
server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name _;
  ssl_reject_handshake on;
}

# ─── Zone Nordiques ─────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.zonenordiques.com;
  ssl_certificate     /etc/ssl/la-zone/zonenordiques.com.pem;
  ssl_certificate_key /etc/ssl/la-zone/zonenordiques.com.key;
  location / { proxy_pass http://zonenordiques; }
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name zonenordiques.com;
  ssl_certificate     /etc/ssl/la-zone/zonenordiques.com.pem;
  ssl_certificate_key /etc/ssl/la-zone/zonenordiques.com.key;
  return 308 https://www.zonenordiques.com$request_uri;
}

