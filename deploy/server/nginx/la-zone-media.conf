# /etc/nginx/snippets/la-zone-media.conf — included in each brand's server.
# Podcast audio written by the app (apps/web/src/lib/mediaStorage.ts) is
# served straight from disk. File names are unique (timestamp + random), so
# they can be cached for a long time; nginx handles Range requests (seeking).
location /media/ {
  alias /srv/la-zone/media/;
  types { audio/mpeg mp3; audio/mp4 m4a; audio/ogg ogg; audio/webm webm; }
  default_type application/octet-stream;
  add_header Cache-Control "public, max-age=31536000, immutable";   # 2xx/3xx only: never cache a 404
  add_header X-Content-Type-Options nosniff always;
  # Only finished files: the app writes "<name>.part" then renames.
  location ~ \.part$ { return 404; }
}
